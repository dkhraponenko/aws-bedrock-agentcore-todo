# Runs on every commit; `pre-commit install --install-hooks` wires it up and
# `pre-commit run --all-files` checks the whole repo.
#
# Revisions are pinned rather than floating: a hook that updates itself changes
# what the repo enforces without anyone reviewing it. `pre-commit autoupdate`
# bumps them deliberately.

exclude: '^(infrastructure/\.terraform/|infrastructure/build/)'

repos:
  # --- general hygiene ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      # tools.json is the tool contract Terraform expands; malformed or
      # hand-reindented JSON there breaks the gateway target, not a test.
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent, "2", --no-sort-keys]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  # --- Python: lint, format, types ---------------------------------------------------
  # Pinned to the version installed locally. Ruff 0.16 migrates `# noqa: RULE`
  # to its new `# ruff: ignore[rule-name]` syntax, which older ruff then
  # rejects — so hook and CLI have to agree, not merely both be "ruff".
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^(src|scripts|tests)/
        # mypy runs in its own isolated environment, so anything it needs to
        # resolve imports has to be listed here explicitly.
        additional_dependencies:
          - boto3>=1.35
          - moto[dynamodb]>=5.0
          - pytest>=8.3
          - python-dotenv>=1.0

  # --- infrastructure ----------------------------------------------------------------
  # tflint and trivy are deliberately left out: both are separate binaries this
  # hook does not install, so including them makes a fresh clone fail to commit.
  # They run in .github/workflows/checks.yml instead, where a runner installs
  # them anyway.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false

  # The one thing terraform_validate structurally cannot see: the backend block
  # is parsed before variables exist, so the state bucket is named by a literal
  # in two files and nothing checks that the two still agree.
  - repo: local
    hooks:
      - id: state-bucket-name
        name: backend and bootstrap name the same bucket
        entry: scripts/check_state_bucket.sh
        language: system
        files: ^infrastructure/(backend\.tf|bootstrap/variables\.tf)$
        pass_filenames: false

  # --- tests -------------------------------------------------------------------------
  # On push rather than on commit: the suite takes seconds, but a failing
  # coverage gate should not block writing down work in progress.
  - repo: local
    hooks:
      - id: pytest
        name: pytest with coverage gate
        entry: .venv/bin/pytest
        language: system
        # The suite does not depend on which files changed, so it must not be
        # skipped when none of them are .py: pyproject.toml carries the coverage
        # gate, the import paths and the test environment, and a push that
        # touches only that would otherwise never run the tests it configures.
        always_run: true
        pass_filenames: false
        stages: [pre-push]
