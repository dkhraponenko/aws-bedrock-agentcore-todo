# The only thing that talks to AWS. Never triggered by a push or a pull request:
# deploying is a decision, so it is a button.
name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run against AWS
        type: choice
        # plan-destroy exists because the two are not opposites: plan shows what
        # would be built, and without this there was no way to read the list of
        # things a destroy would remove except by removing them.
        options: [plan, plan-destroy, apply, destroy]
        default: plan
      confirm:
        description: For destroy only - type todo-agent
        type: string
        default: ""

permissions:
  contents: read

# Never cancel a run already in flight. An interrupted apply leaves state
# describing something that is only half built, which is worse than waiting.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # A job of its own, with no needs, so it starts immediately and alone. As a
  # first step of the terraform job it was correct but useless: that job waits
  # for checks, so a mistyped confirmation took three minutes of test suite to
  # report itself. Nothing here reads the repository or holds a credential.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Two clicks separate apply from destroy in that dropdown, so the second
      # one has to be typed out. plan-destroy is exempt: it only reads.
      - name: Confirm a destroy
        if: inputs.action == 'destroy' && inputs.confirm != 'todo-agent'
        run: |
          echo "destroy requires confirm to be exactly: todo-agent" >&2
          exit 1

  checks:
    uses: ./.github/workflows/checks.yml

  terraform:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job mints an OIDC token, so only this job is granted one. The
    # token is what configure-aws-credentials exchanges for an hour of access;
    # no long-lived key is stored in GitHub at all.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below this line talks to git again, and the default leaves
          # the job's token written into .git/config for every later step and
          # every process they start.
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A secret rather than a variable: it carries the account id, and
          # terraform prints ARNs into logs that go public with the repository.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Masking the secret only hides that one string. The same account id
          # appears inside every other ARN a plan prints - arn:aws:logs:...:<id>
          # - and this is what redacts those too.
          mask-aws-account-id: true
          # Matches var.aws_region and the backend block, both of which default
          # to us-east-1. Deliberately not a secret: GitHub redacts secrets by
          # substring, so masking a region would blank it inside every ARN in
          # the log and leave the plan unreadable.
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # AgentCore's image has no boto3, so the artifact carries its own
      # dependencies and something has to stage them before terraform reads the
      # directory. Not a data source shelling out from inside terraform: that
      # would also run on every plan, and this runner starts with nothing built.
      - name: Build the runtime artifact
        working-directory: ${{ github.workspace }}
        run: scripts/build_runtime.sh

      - name: Init
        run: terraform init -input=false

      # Always a saved plan, even for apply. What the log shows is then the plan
      # that ran, not a description of what a second plan would have decided.
      # Both destroy actions take this same path, so a removal is always shown
      # before anything is removed - and plan-destroy stops right here.
      - name: Plan
        run: terraform plan -input=false -out=tfplan ${{ contains(inputs.action, 'destroy') && '-destroy' || '' }}

      - name: Plan summary
        run: |
          {
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Named rather than negated. `!= 'plan'` would have quietly applied
      # plan-destroy the day it was added, and would do the same to whatever
      # read-only action is added next.
      - name: Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -input=false tfplan
