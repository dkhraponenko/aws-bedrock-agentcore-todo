<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>todo-agent architecture: AgentCore harness and gateway in front of a Lambda and DynamoDB</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- AWS account boundary -->
  <rect x="24" y="118" width="952" height="546" rx="14" fill="#fafbfc" stroke="#c8ced6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="46" y="146" font-size="13" fill="#5f6b7a" letter-spacing="1.4">AWS ACCOUNT &#183; us-east-1</text>

  <!-- ============ 1. operator ============ -->
  <g>
    <rect x="310" y="26" width="380" height="72" rx="11" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
    <g transform="translate(326, 38)">
      <rect width="48" height="48" rx="9" fill="#232f3e"/>
      <rect x="10" y="13" width="28" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M15 20 l5 4 -5 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 28 h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="390" y="57" font-size="16" font-weight="600" fill="#16191f">scripts/chat.py</text>
    <text x="390" y="78" font-size="13" fill="#5f6b7a">&#8220;delete buy a milk&#8221;</text>
  </g>

  <path d="M500 98 V 158" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="134" font-size="12.5" fill="#5f6b7a">InvokeHarness</text>

  <!-- ============ 2. harness ============ -->
  <g>
    <rect x="310" y="158" width="380" height="84" rx="11" fill="#ffffff" stroke="#01a88d" stroke-width="1.8"/>
    <g transform="translate(326, 176)">
      <rect width="48" height="48" rx="9" fill="#01a88d"/>
      <circle cx="15" cy="15" r="4.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="15" cy="33" r="4.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="34" cy="24" r="5.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M19 17 l10 5 M19 31 l10 -5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="390" y="194" font-size="16" font-weight="600" fill="#16191f">AgentCore Harness</text>
    <text x="390" y="214" font-size="13" fill="#5f6b7a">managed agent loop &#183; system prompt</text>
    <text x="390" y="232" font-size="13" fill="#5f6b7a">var.agent_model &#183; max_iterations 10</text>
  </g>

  <path d="M500 242 V 302" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="278" font-size="12.5" fill="#5f6b7a">InvokeGateway &#183; SigV4</text>

  <!-- ============ 3. gateway ============ -->
  <g>
    <rect x="310" y="302" width="380" height="84" rx="11" fill="#ffffff" stroke="#01a88d" stroke-width="1.8"/>
    <g transform="translate(326, 320)">
      <rect width="48" height="48" rx="9" fill="#01a88d"/>
      <path d="M15 12 v24 M33 12 v24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 24 h12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 19 l5 5 -5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="390" y="338" font-size="16" font-weight="600" fill="#16191f">AgentCore Gateway</text>
    <text x="390" y="358" font-size="13" fill="#5f6b7a">MCP facade &#183; inbound auth AWS_IAM</text>
    <text x="390" y="376" font-size="13" fill="#5f6b7a">target &#8220;todo&#8221; &#183; 5 tool schemas</text>
  </g>

  <path d="M500 386 V 446" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="422" font-size="12.5" fill="#5f6b7a">lambda:InvokeFunction</text>

  <!-- ============ 4. lambda ============ -->
  <g>
    <rect x="310" y="446" width="380" height="84" rx="11" fill="#ffffff" stroke="#ed7100" stroke-width="1.8"/>
    <g transform="translate(326, 464)">
      <rect width="48" height="48" rx="9" fill="#ed7100"/>
      <text x="24" y="36" font-size="30" font-family="Georgia, 'Times New Roman', serif" fill="#ffffff" text-anchor="middle">&#955;</text>
    </g>
    <text x="390" y="482" font-size="16" font-weight="600" fill="#16191f">Lambda &#183; todo_agent</text>
    <text x="390" y="502" font-size="13" fill="#5f6b7a">event = tool arguments, flat JSON</text>
    <text x="390" y="520" font-size="13" fill="#5f6b7a">tool name in client_context.custom</text>
  </g>

  <path d="M500 530 V 590" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="566" font-size="12.5" fill="#5f6b7a">Query / Put / Update / Delete</text>

  <!-- ============ 5. dynamodb ============ -->
  <g>
    <rect x="310" y="590" width="380" height="60" rx="11" fill="#ffffff" stroke="#c925d1" stroke-width="1.8"/>
    <g transform="translate(326, 596)">
      <rect width="48" height="48" rx="9" fill="#c925d1"/>
      <ellipse cx="24" cy="15" rx="12" ry="4.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M12 15 v18 c0 2.5 5.4 4.5 12 4.5 s12 -2 12 -4.5 v-18" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M12 24 c0 2.5 5.4 4.5 12 4.5 s12 -2 12 -4.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <text x="390" y="614" font-size="16" font-weight="600" fill="#16191f">DynamoDB</text>
    <text x="390" y="634" font-size="13" fill="#5f6b7a">PK user_id &#183; SK item_id &#183; no Scans</text>
  </g>

  <!-- ============ IAM roles, left rail ============ -->
  <g transform="translate(40, 176)">
    <rect width="230" height="66" rx="10" fill="#ffffff" stroke="#dd344c" stroke-width="1.5"/>
    <g transform="translate(14, 14)">
      <rect width="38" height="38" rx="8" fill="#dd344c"/>
      <circle cx="15" cy="15" r="5.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M19 19 l9 9 M25 25 l-3 3 M28 28 l-3 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="62" y="30" font-size="13" font-weight="600" fill="#16191f">harness role</text>
    <text x="62" y="48" font-size="11.5" fill="#5f6b7a">model, gateway, memory</text>
  </g>
  <path d="M270 209 H 310" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g transform="translate(40, 320)">
    <rect width="230" height="66" rx="10" fill="#ffffff" stroke="#dd344c" stroke-width="1.5"/>
    <g transform="translate(14, 14)">
      <rect width="38" height="38" rx="8" fill="#dd344c"/>
      <circle cx="15" cy="15" r="5.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M19 19 l9 9 M25 25 l-3 3 M28 28 l-3 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="62" y="30" font-size="13" font-weight="600" fill="#16191f">gateway role</text>
    <text x="62" y="48" font-size="11.5" fill="#5f6b7a">one action, one function</text>
  </g>
  <path d="M270 353 H 310" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g transform="translate(40, 464)">
    <rect width="230" height="66" rx="10" fill="#ffffff" stroke="#dd344c" stroke-width="1.5"/>
    <g transform="translate(14, 14)">
      <rect width="38" height="38" rx="8" fill="#dd344c"/>
      <circle cx="15" cy="15" r="5.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M19 19 l9 9 M25 25 l-3 3 M28 28 l-3 3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="62" y="30" font-size="13" font-weight="600" fill="#16191f">lambda role</text>
    <text x="62" y="48" font-size="11.5" fill="#5f6b7a">5 actions, one table</text>
  </g>
  <path d="M270 497 H 310" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ============ right rail: memory + logs ============ -->
  <g transform="translate(730, 176)">
    <rect width="230" height="66" rx="10" fill="#ffffff" stroke="#01a88d" stroke-width="1.5"/>
    <g transform="translate(14, 14)">
      <rect width="38" height="38" rx="8" fill="#01a88d"/>
      <path d="M12 27 v-8 a7 7 0 0 1 14 0 v8" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="10" y="26" width="18" height="3" rx="1.5" fill="#ffffff"/>
    </g>
    <text x="62" y="30" font-size="13" font-weight="600" fill="#16191f">AgentCore Memory</text>
    <text x="62" y="48" font-size="11.5" fill="#5f6b7a">session history</text>
  </g>
  <path d="M690 209 H 730" stroke="#01a88d" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g transform="translate(730, 464)">
    <rect width="230" height="66" rx="10" fill="#ffffff" stroke="#e7157b" stroke-width="1.5"/>
    <g transform="translate(14, 14)">
      <rect width="38" height="38" rx="8" fill="#e7157b"/>
      <polyline points="10,27 16,19 22,24 29,12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="62" y="30" font-size="13" font-weight="600" fill="#16191f">CloudWatch Logs</text>
    <text x="62" y="48" font-size="11.5" fill="#5f6b7a">14-day retention</text>
  </g>
  <path d="M690 497 H 730" stroke="#e7157b" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
